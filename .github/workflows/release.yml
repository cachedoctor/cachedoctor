name: release
on:
  push:
    # Full semver only — the moving major-alias tag (v1), used for the
    # Action reference, can be re-pointed without cutting a duplicate release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# GoReleaser needs to create/replace the GitHub release and upload assets.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, so the changelog and version resolve
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
