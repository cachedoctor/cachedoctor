name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: fmt / vet / test
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - name: ci-gate scenario tests
        run: bash scripts/test-ci-gate.sh
