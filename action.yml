name: cachedoctor
description: Catch prompt-cache / LLM-cost regressions in your PRs before they hit the bill — the CI gate for cachedoctor, the Anthropic/OpenAI cache diagnostic (CLI + read-only observe proxy).
branding:
  icon: activity
  color: green

inputs:
  fixtures:
    description: Glob of Anthropic/OpenAI request JSON fixtures to check (default **/*.cachedoctor.json).
    default: ""
  base-ref:
    description: Base git ref to diff changed fixtures against (enables regression detection). Empty to skip.
    default: ""
  version:
    description: >-
      cachedoctor version to install (go module version). Empty (default) builds
      the source bundled with this action, so script and binary always match.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false
    - name: Install cachedoctor
      shell: bash
      env:
        # env indirection, not raw ${{ }} interpolation into the script —
        # the canonical GitHub Actions injection hardening.
        CD_VERSION: ${{ inputs.version }}
      run: |
        BIN_DIR="$RUNNER_TEMP/cachedoctor-bin"
        mkdir -p "$BIN_DIR"
        if [ -n "$CD_VERSION" ]; then
          GOBIN="$BIN_DIR" go install "github.com/cachedoctor/cachedoctor@$CD_VERSION"
        else
          (cd "${{ github.action_path }}" && go build -o "$BIN_DIR/cachedoctor" .)
        fi
        echo "$BIN_DIR" >> "$GITHUB_PATH"
    - name: Run cache/cost gate
      shell: bash
      env:
        CACHEDOCTOR_FIXTURES: ${{ inputs.fixtures }}
        CACHEDOCTOR_BASE: ${{ inputs.base-ref }}
        CACHEDOCTOR_PR: ${{ github.event.pull_request.number }}
        GITHUB_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/scripts/ci-gate.sh"
